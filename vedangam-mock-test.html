<title>वेदाङ्गम् मॉक टेस्ट</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centred test column; palette is a wrap grid under the question on phones, a side rail on wide screens. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#16213a; --muted:#5a6683; --line:#d9dfeb;
  --accent:#2d3f8f; --accent-ink:#ffffff; --mark:#b86a00; --ok:#1c7a46; --ok-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fbe7e5;
  --sel:#e6ebfb;
  --f-dev:"Noto Sans Devanagari","Nirmala UI","Mangal",sans-serif;
  --f-display:"Tiro Devanagari Sanskrit","Noto Sans Devanagari",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --surface:#171e33; --ink:#e8ecf7; --muted:#9aa5c4; --line:#2a3454;
  --accent:#8ea2ff; --accent-ink:#0f1424; --mark:#f0a53a; --ok:#6bd39a; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1a1a; --sel:#222c52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --surface:#171e33; --ink:#e8ecf7; --muted:#9aa5c4; --line:#2a3454;
  --accent:#8ea2ff; --accent-ink:#0f1424; --mark:#f0a53a; --ok:#6bd39a; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1a1a; --sel:#222c52; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
*{box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto}
.dev{font-family:var(--f-dev)}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* setup */
.hero{padding:28px 0 8px}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,7vw,56px);line-height:1.15;margin-top:6px}
.hero p{color:var(--muted);max-width:60ch;margin:12px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.size{border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:left;background:var(--bg)}
.size b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.size span{font-size:13px;color:var(--muted)}
.size[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opts label{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.opts input{margin-top:4px;width:18px;height:18px}
.notes summary{cursor:pointer;font-weight:600}
.notes ul{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.notes li{margin-bottom:6px}
.notes .dev{color:var(--ink)}

/* test */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{flex:1 1 160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:100px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:18px}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;margin-top:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qtext{font-family:var(--f-dev);font-size:clamp(19px,3.4vw,23px);line-height:1.6;margin:12px 0 16px;font-weight:500}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);font-family:var(--f-dev);font-size:19px;line-height:1.5}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 13px var(--f-ui);color:var(--muted);margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.choice[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav .sp{flex:1}
.mark.on{border-color:var(--mark);color:var(--mark)}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pal h3{font-size:14px;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font:500 13px var(--f-ui);font-variant-numeric:tabular-nums;position:relative}
.cell.ans{background:var(--sel);border-color:var(--accent)}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--mark)}
.cell.cur{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.confirm{margin-top:16px;padding:14px;border:1.5px solid var(--mark);border-radius:10px;background:var(--bg)}
.confirm .nav{margin-top:10px}

/* result */
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--f-display);font-size:clamp(56px,14vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;flex:1 1 280px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filters .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.rev .qtext{margin:8px 0 12px;font-size:20px}
.ro{font-family:var(--f-dev);font-size:18px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);margin-bottom:6px;display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.ro small{font:600 12px var(--f-ui);white-space:nowrap}
.ro.correct{background:var(--ok-bg);border-color:var(--ok)} .ro.correct small{color:var(--ok)}
.ro.wrong{background:var(--bad-bg);border-color:var(--bad)} .ro.wrong small{color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.skip{color:var(--muted)} .tag.c{color:var(--ok);border-color:var(--ok)} .tag.w{color:var(--bad);border-color:var(--bad)}
.edit{font-size:12px;color:var(--mark);margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

var app=document.getElementById("app");
var S={size:50,shuffleQ:true,shuffleO:true,items:[],ans:[],flag:[],cur:0,left:0,total:0,tid:null,phase:"setup",filter:"all",askSubmit:false};
var LET=["अ","ब","स","द"];

function h(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(t){var m=Math.floor(t/60),s=t%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s}

function renderSetup(){
  var notes=Q.filter(function(q){return q[4]});
  var sizes=[25,50,100,Q.length];
  app.innerHTML=
  '<header class="hero"><div class="eyebrow">Vedangam · Bit Bank 1 · '+Q.length+' प्रश्न</div>'+
  '<h1 class="dev">वेदाङ्गम् मॉक टेस्ट</h1>'+
  '<p>ऋग्वेद, यजुर्वेद, सामवेद और अथर्ववेद की संहिता, शाखा, मण्डल, ऋषि और संख्या पर बहुविकल्पीय प्रश्न। प्रश्न वेदाङ्गम् की Bit Bank-1 पुस्तिका से लिए गए हैं।</p></header>'+
  '<section class="panel"><h2 style="font-size:18px">कितने प्रश्न?</h2><div class="sizes">'+
  sizes.map(function(n){return '<button class="size" data-size="'+n+'" aria-pressed="'+(S.size===n)+'"><b>'+n+'</b><span>'+(n===Q.length?'पूरी बैंक':'यादृच्छिक चयन')+' · '+fmt(n*45)+'</span></button>'}).join('')+
  '</div><div class="opts">'+
  '<label><input type="checkbox" id="oq"'+(S.shuffleQ?' checked':'')+'> प्रश्नों का क्रम मिलाओ</label>'+
  '<label><input type="checkbox" id="oo"'+(S.shuffleO?' checked':'')+'> विकल्पों का क्रम मिलाओ</label></div>'+
  '<p style="color:var(--muted);font-size:14px;margin:14px 0 0">हर प्रश्न का 1 अंक, नकारात्मक अंकन नहीं। समय: प्रति प्रश्न 45 सेकंड।</p>'+
  '<div class="nav"><button class="btn primary" id="start">टेस्ट शुरू करो</button></div></section>'+
  '<section class="panel notes"><details><summary>स्रोत में सुधार ('+notes.length+')</summary><ul>'+
  notes.map(function(q){return '<li><b>प्र. '+q[0]+':</b> '+h(q[4])+'</li>'}).join('')+
  '</ul><p style="font-size:13px;color:var(--muted);margin:10px 0 0">बाकी प्रश्न और उत्तर पुस्तिका के अनुसार ही हैं। प्र. 29 (सायणभाष्य का पहला अंग्रेज़ी अनुवाद) में पुस्तिका माक्समुलर देती है; परीक्षा से पहले अपने पाठ्यक्रम से मिला लें।</p></details></section>';
  app.querySelectorAll(".size").forEach(function(b){b.onclick=function(){S.size=+b.dataset.size;renderSetup()}});
  document.getElementById("oq").onchange=function(e){S.shuffleQ=e.target.checked};
  document.getElementById("oo").onchange=function(e){S.shuffleO=e.target.checked};
  document.getElementById("start").onclick=start;
}

function start(){
  var pool=S.shuffleQ||S.size<Q.length?shuffle(Q):Q.slice();
  pool=pool.slice(0,S.size);
  if(!S.shuffleQ)pool.sort(function(a,b){return a[0]-b[0]});
  S.items=pool.map(function(q){
    var o=q[2].map(function(t,i){return {t:t,ok:i===q[3]}});
    return {id:q[0],q:q[1],o:S.shuffleO?shuffle(o):o,note:q[4]};
  });
  S.ans=S.items.map(function(){return -1});
  S.flag=S.items.map(function(){return false});
  S.cur=0;S.total=S.left=S.items.length*45;S.phase="test";S.askSubmit=false;
  clearInterval(S.tid);
  S.tid=setInterval(function(){S.left--;var t=document.getElementById("tm");
    if(S.left<=0){finish();return}
    if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<=60)}},1000);
  renderTest();window.scrollTo(0,0);
}

function answeredCount(){return S.ans.filter(function(a){return a>=0}).length}

function renderTest(){
  var it=S.items[S.cur],n=S.items.length;
  var html='<div class="top"><span class="eyebrow">प्रश्न '+(S.cur+1)+' / '+n+'</span>'+
   '<div class="bar"><i style="width:'+(answeredCount()/n*100)+'%"></i></div>'+
   '<span class="timer'+(S.left<=60?' low':'')+'" id="tm">'+fmt(S.left)+'</span>'+
   '<button class="btn" id="sub">जमा करो</button></div>';
  html+='<div class="grid"><section class="qcard"><div class="qmeta"><span>स्रोत प्र. '+it.id+'</span><span>'+answeredCount()+' उत्तरित</span></div>'+
   '<div class="qtext">'+h(it.q)+'</div><div class="choices">'+
   it.o.map(function(o,i){return '<button class="choice" data-i="'+i+'" aria-pressed="'+(S.ans[S.cur]===i)+'"><span class="k">'+(i+1)+'</span><span>'+h(o.t)+'</span></button>'}).join('')+
   '</div><div class="nav"><button class="btn" id="prev"'+(S.cur===0?' disabled':'')+'>← पिछला</button>'+
   '<button class="btn" id="clr"'+(S.ans[S.cur]<0?' disabled':'')+'>चयन हटाओ</button>'+
   '<button class="btn mark'+(S.flag[S.cur]?' on':'')+'" id="flg" aria-pressed="'+S.flag[S.cur]+'">'+(S.flag[S.cur]?'निशान हटाओ':'पुनर्विचार हेतु निशान')+'</button>'+
   '<span class="sp"></span><button class="btn primary" id="next"'+(S.cur===n-1?' disabled':'')+'>अगला →</button></div>';
  if(S.askSubmit){
    var un=n-answeredCount();
    html+='<div class="confirm"><b>'+(un?un+' प्रश्न अनुत्तरित हैं।':'सभी प्रश्न हल हो गए हैं।')+'</b> टेस्ट जमा करें?<div class="nav"><button class="btn primary" id="yes">हाँ, जमा करो</button><button class="btn" id="no">वापस जाओ</button></div></div>';
  }
  html+='</section><aside class="pal"><h3>प्रश्न-पट</h3><div class="cells">'+
   S.items.map(function(_,i){return '<button class="cell'+(S.ans[i]>=0?' ans':'')+(S.flag[i]?' flag':'')+(i===S.cur?' cur':'')+'" data-g="'+i+'" aria-label="प्रश्न '+(i+1)+'">'+(i+1)+'</button>'}).join('')+
   '</div><div class="legend"><span>■ उत्तरित</span><span style="color:var(--mark)">● निशान</span></div></aside></div>';
  app.innerHTML=html;
  app.querySelectorAll(".choice").forEach(function(b){b.onclick=function(){S.ans[S.cur]=+b.dataset.i;renderTest()}});
  app.querySelectorAll(".cell").forEach(function(b){b.onclick=function(){S.cur=+b.dataset.g;renderTest()}});
  document.getElementById("prev").onclick=function(){S.cur--;renderTest()};
  document.getElementById("next").onclick=function(){S.cur++;renderTest()};
  document.getElementById("clr").onclick=function(){S.ans[S.cur]=-1;renderTest()};
  document.getElementById("flg").onclick=function(){S.flag[S.cur]=!S.flag[S.cur];renderTest()};
  document.getElementById("sub").onclick=function(){S.askSubmit=true;renderTest()};
  var y=document.getElementById("yes");if(y){y.onclick=finish;document.getElementById("no").onclick=function(){S.askSubmit=false;renderTest()}}
}

function finish(){
  clearInterval(S.tid);S.phase="result";S.filter="all";renderResult();window.scrollTo(0,0);
}

function status(i){
  var a=S.ans[i];if(a<0)return "skip";
  return S.items[i].o[a].ok?"c":"w";
}

function renderResult(){
  var n=S.items.length,c=0,w=0,s=0;
  S.items.forEach(function(_,i){var t=status(i);if(t==="c")c++;else if(t==="w")w++;else s++});
  var pct=Math.round(c/n*100),used=S.total-Math.max(S.left,0);
  var html='<header class="hero"><div class="eyebrow">परिणाम</div><h1 class="dev" style="font-size:clamp(28px,6vw,40px)">'+
    (pct>=80?'उत्तम तैयारी':pct>=60?'अच्छा प्रयास':pct>=40?'और अभ्यास चाहिए':'पाठ दोबारा पढ़ें')+'</h1></header>'+
    '<section class="panel"><div class="score"><div class="big">'+c+'<span style="font-size:.4em;color:var(--muted)"> / '+n+'</span></div>'+
    '<div class="stats"><div class="stat ok"><b>'+c+'</b><span>सही</span></div><div class="stat bad"><b>'+w+'</b><span>गलत</span></div>'+
    '<div class="stat"><b>'+s+'</b><span>अनुत्तरित</span></div><div class="stat"><b>'+pct+'%</b><span>प्रतिशत</span></div>'+
    '<div class="stat"><b>'+fmt(used)+'</b><span>लगा समय</span></div></div></div>'+
    '<div class="nav"><button class="btn primary" id="again">नया टेस्ट</button></div></section>';
  var F=[["all","सभी ("+n+")"],["w","गलत ("+w+")"],["skip","अनुत्तरित ("+s+")"],["c","सही ("+c+")"]];
  html+='<div class="filters">'+F.map(function(f){return '<button class="btn" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>';
  S.items.forEach(function(it,i){
    var t=status(i);if(S.filter!=="all"&&S.filter!==t)return;
    html+='<article class="rev"><div class="qmeta"><span>प्रश्न '+(i+1)+' · स्रोत प्र. '+it.id+'</span><span class="tag '+t+'">'+(t==="c"?'सही':t==="w"?'गलत':'अनुत्तरित')+'</span></div>'+
      '<div class="qtext">'+h(it.q)+'</div>'+
      it.o.map(function(o,j){
        var cls=o.ok?' correct':(S.ans[i]===j?' wrong':'');
        var lab=o.ok?(S.ans[i]===j?'आपका उत्तर · सही':'सही उत्तर'):(S.ans[i]===j?'आपका उत्तर':'');
        return '<div class="ro'+cls+'"><span>'+h(o.t)+'</span><small>'+lab+'</small></div>';
      }).join('')+(it.note?'<div class="edit">सुधार: '+h(it.note)+'</div>':'')+'</article>';
  });
  app.innerHTML=html;
  document.getElementById("again").onclick=function(){S.phase="setup";renderSetup();window.scrollTo(0,0)};
  app.querySelectorAll(".filters .btn").forEach(function(b){b.onclick=function(){S.filter=b.dataset.f;renderResult()}});
}

renderSetup();
</script>
