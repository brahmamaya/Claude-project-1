name: Update and deploy
on:
  schedule: [{cron: "17 3 * * *"}, {cron: "34 6 * * *"}, {cron: "41 12 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
concurrency: {group: pages, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -t .
      - name: Run pipeline (a failure keeps existing data)
        run: python -m pipeline.run
      - name: Link check (marks dead links; never fails the run)
        run: python -m pipeline.linkcheck
      - run: python -m unittest discover -s tests -t .
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "think-orbit-bot"; git config user.email "bot@users.noreply.github.com"
          git add site && (git diff --cached --quiet || git commit -m "Daily data update") && git push
      - name: Keep schedule alive (GitHub pauses idle schedules)
        continue-on-error: true
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
